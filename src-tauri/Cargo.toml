[package]
name = "pico"
version = "0.1.0"
default-run = "Pico"
description = "Pico: Android file transfer for macOS"
authors = ["varalikaagarwal"]
license = "MIT"
repository = "https://github.com/A3In1/Pico"
edition = "2021"

# The binary name is what macOS shows in the menu bar and Activity Monitor.
[[bin]]
name = "Pico"
path = "src/main.rs"

[lib]
name = "pico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow"] }
